<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hajiz console</title>
    <link rel="stylesheet" href="/styles.css" />
    <link rel="icon" href="/mark.svg" />
  </head>
  <body>
    <div class="app">
      <!--
        The sidebar is the whole product in one column. Order is deliberate:
        the four pages someone opens every day first, then the pages they touch
        once while setting the appliance up, then help. Review queue carries a
        count because a prompt sitting there has a employee waiting on it.
      -->
      <aside class="sidebar">
        <div class="sidebar__brand">
          <svg class="sidebar__mark" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M12 2.5 4 6v6.2c0 4.6 3.2 8.4 8 9.3 4.8-.9 8-4.7 8-9.3V6l-8-3.5Z"
                  stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" />
            <path d="M12 2.5V21.5" stroke="currentColor" stroke-width="1.6" />
          </svg>
          <span class="sidebar__name">Hajiz</span>
        </div>

        <div class="sidebar__scroll">
          <nav class="navgroup" aria-label="Operations">
            <div class="navgroup__label">Operations</div>
            <div id="nav-ops"></div>
          </nav>

          <nav class="navgroup" aria-label="Setup">
            <div class="navgroup__label">Setup</div>
            <div id="nav-setup"></div>
          </nav>
        </div>

        <div class="sidebar__foot">
          <div class="applianceCard">
            <span class="applianceCard__name" id="appliance-name">gw-local</span>
            <span class="applianceCard__mode">
              <span class="dot" id="appliance-dot"></span>
              <span id="appliance-mode">connecting…</span>
            </span>
          </div>
        </div>
      </aside>

      <div class="main">
        <header class="topbar">
          <span class="topbar__title" id="page-title">Monitor</span>
          <span class="topbar__spacer"></span>
          <span class="live">
            <span class="dot" id="conn-dot"></span>
            <span id="conn-text">connecting…</span>
          </span>
          <div class="themeToggle" role="group" aria-label="Theme">
            <button type="button" data-theme-set="light" aria-pressed="true">Light</button>
            <button type="button" data-theme-set="dark" aria-pressed="false">Dark</button>
          </div>
        </header>

        <main class="content">
          <div class="page" id="page"></div>
        </main>
      </div>
    </div>

    <script type="module" src="/app.js"></script>
  </body>
</html>
